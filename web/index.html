<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoranda</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0b0d10; --panel:#12151a; --line:#1e232b; --ink:#e8eaed; --dim:#a6aeba;
    --accent:#4ade80; --warn:#fbbf24; --bad:#f87171; --chip:#1a1f27;
    --button-ink:#06210f;--field:#0e1116;--me:#1d2a22;--me-line:#2b4034;
  }
  :root[data-theme="light"]{color-scheme:light;--bg:#f5f7f4;--panel:#fff;--line:#dce3dc;
    --ink:#17211a;--dim:#536257;--accent:#168344;--warn:#895a00;--bad:#b42318;
    --chip:#edf2ed;--button-ink:#fff;--field:#fff;--me:#e9f5ec;--me-line:#b8d9c0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);transition:background .2s,color .2s;
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;padding:8px 0 16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;letter-spacing:.2px}
  header .brand{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;
                margin-right:2px}
  header .mark{width:22px;height:22px;border-radius:7px;
               background:linear-gradient(150deg,#4ade80,#22c55e);display:grid;
               place-items:center;color:#08130c;font-weight:800;font-size:12px}
  header .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);
              padding:2px 7px;border-radius:99px}
  /* The shop name is not one more setting next to the others: it answers "which
     book am I looking at", so it is the one chip that reads as a name. */
  header .tag.shop{color:var(--ink);font-weight:600;
                   border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
           text-transform:uppercase;letter-spacing:.6px}
  #log{height:52vh;min-height:280px;overflow-y:auto;display:flex;flex-direction:column;
       gap:8px;padding-right:4px}
  .msg{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;
       word-wrap:break-word}
  .me{align-self:flex-end;background:var(--me);border:1px solid var(--me-line)}
  .bot{align-self:flex-start;background:var(--chip);border:1px solid var(--line)}
  .confirm{border-color:var(--warn)!important}
  .sys{align-self:center;font-size:12px;color:var(--dim);text-align:center}
  form{display:flex;gap:8px;margin-top:12px}
  input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);
                      background:var(--field);color:var(--ink);padding:11px 12px}
  input{flex:1;min-width:0}
  select{cursor:pointer;padding-right:30px;appearance:none;background-image:
         linear-gradient(45deg,transparent 50%,var(--dim) 50%),
         linear-gradient(135deg,var(--dim) 50%,transparent 50%);
         background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
         background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  button{background:var(--accent);color:var(--button-ink);border:0;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);
               font-weight:500}
  .botLink{display:inline-block;margin:4px 0 8px;padding:9px 12px;border-radius:10px;
           background:var(--accent);color:var(--button-ink);font-weight:600;
           text-decoration:none}
  #telegramLinkCard ol{padding-left:22px}
  #telegramLinkCard li{margin:4px 0}
  /* The new-book form is a form, not one more line of chat. It used to sit in the
     same flex row as everything else, so four fields and a paragraph fought over
     898px: the shop-name box came out 26px wide with the explanation beside it at
     495px. Fields stack under their own label now, and the note sits under the one
     field it is about. */
  form.stack{display:block}
  form.stack label{display:block;font-size:11px;color:var(--dim);font-weight:600;
                   text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
  label.hidden{display:none!important}
  form.stack label:first-of-type{margin-top:0}
  form.stack input,form.stack select{display:block;width:100%}
  form.stack .hint{margin:7px 0 0}
  form.stack button{display:block;width:100%;margin-top:18px;padding:12px}
  /* Two forms in one card read as one form until something says otherwise. */
  .split{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;
         margin:18px 0 2px}
  .split:before,.split:after{content:"";height:1px;background:var(--line);flex:1}
  .langrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .langrow button{flex:1 1 160px}
  .row{display:flex;gap:8px}
  .person{border-top:1px solid var(--line);padding:10px 0}
  .person:first-child{border-top:0;padding-top:0}
  .person .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .person .name{font-weight:600}
  .person .owe{color:var(--warn);font-variant-numeric:tabular-nums}
  .person .owe.zero{color:var(--dim)}
  .person .meta{font-size:12px;color:var(--dim);margin-top:3px}
  .rem{border-top:1px solid var(--line);padding:10px 0}
  .rem:first-child{border-top:0;padding-top:0}
  .rem .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .rem .who{font-weight:600}
  .rem .when{font-weight:600;font-variant-numeric:tabular-nums}
  .rem .kind{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .rem .what{font-size:13px;margin-top:3px}
  code.key{display:block;background:#0e1116;border:1px dashed var(--line);padding:10px;
           border-radius:10px;font-size:13px;word-break:break-all;margin:8px 0}
  .hidden{display:none!important}
  .hint{font-size:12px;color:var(--dim);margin-top:8px}
  .err{color:var(--bad);font-size:13px}
  .themeBtn{margin-left:auto}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/" id="brandLink"><span class="mark">M</span><h1>Memoranda</h1></a>
    <!-- Which shop this is. Before this the header said the trade, the
         language and the money, and nothing said whose book you were looking
         at, so opening the wrong key looked exactly like opening the right one. -->
    <span class="tag shop hidden" id="nameTag"></span>
    <span class="tag" id="bizTag" data-i18n="ui_no_pack"></span>
    <span class="tag" id="langTag"></span>
    <span class="tag" id="curTag"></span>
    <button class="ghost themeBtn" id="themeBtn" type="button" aria-label="Switch color theme">Light mode</button>
  </header>

  <!-- language first: everything after this screen is written in the choice -->
  <section id="langGate">
    <div class="card">
      <h2 data-i18n="ui_pick_lang"></h2>
      <p style="margin-top:0" data-i18n="ui_pick_lang_note"></p>
      <div class="langrow">
        <!-- Two languages, both written by hand, both checked by script. The
             free-language box that used to sit here is gone: a language nobody
             has checked is a language where the buttons can quietly be wrong. -->
        <button type="button" data-pick="id">Bahasa Indonesia</button>
        <button type="button" data-pick="en">English</button>
      </div>
      <div id="langErr" class="err"></div>
    </div>
  </section>

  <!-- gate -->
  <section id="gate" class="hidden">
    <div class="card">
      <h2 data-i18n="ui_enter_title"></h2>
      <p style="margin-top:0" data-i18n="ui_enter_note"></p>
      <form id="enterForm">
        <input id="passkeyIn" data-i18n-ph="ui_key_ph" autocomplete="off">
        <button type="submit" data-i18n="ui_open"></button>
      </form>
      <div class="split" data-i18n="ui_or_new"></div>
      <form id="createForm" class="stack">
        <label for="bizIn" data-i18n="ui_pick_biz"></label>
        <select id="bizIn">
          <option value="ac_service" data-i18n="ui_biz_ac_service"></option>
          <option value="workshop" data-i18n="ui_biz_workshop"></option>
          <option value="tailor" data-i18n="ui_biz_tailor"></option>
          <option value="generic" data-i18n="ui_biz_generic"></option>
        </select>
        <label for="nameIn" data-i18n="ui_pick_name"></label>
        <input id="nameIn" data-i18n-ph="ui_new_ph">
        <!-- Asked once, here, and never again. The book cannot tell whether a
             bare "150" is 150 ribu or $150 by looking at it, and guessing is a
             money bug, so it is a setting instead of a question per message. -->
        <label for="curIn" data-i18n="ui_cur_label"></label>
        <select id="curIn">
          <option value="IDR" data-i18n="ui_cur_idr"></option>
          <option value="USD" data-i18n="ui_cur_usd"></option>
        </select>
        <div class="hint" data-i18n="ui_pick_cur_note"></div>
        <div id="tzFirst" class="hidden">
          <label for="tzFirstSet" data-i18n="ui_tz_confirm_title"></label>
          <select id="tzFirstSet">
            <option value="Asia/Jakarta" data-i18n="ui_tz_jakarta"></option>
            <option value="Asia/Makassar" data-i18n="ui_tz_makassar"></option>
            <option value="Asia/Jayapura" data-i18n="ui_tz_jayapura"></option>
            <option value="Asia/Singapore" data-i18n="ui_tz_singapore"></option>
            <option value="Asia/Bangkok" data-i18n="ui_tz_bangkok"></option>
            <option value="UTC" data-i18n="ui_tz_utc"></option>
            <option value="Europe/London" data-i18n="ui_tz_london"></option>
            <option value="America/New_York" data-i18n="ui_tz_new_york"></option>
            <option value="America/Los_Angeles" data-i18n="ui_tz_los_angeles"></option>
          </select>
          <div class="hint" data-i18n="ui_tz_confirm_note"></div>
        </div>
        <button type="submit" data-i18n="ui_create"></button>
      </form>
      <div id="gateMsg" class="err"></div>
    </div>
  </section>

  <!-- app -->
  <section id="app" class="hidden">
    <div class="grid">
      <div>
        <div class="card">
          <h2 data-i18n="ui_log_title"></h2>
          <div id="log"></div>
          <form id="sayForm">
            <input id="sayIn" data-i18n-ph="ui_say_ph" autocomplete="off">
            <button type="submit" id="sayBtn" data-i18n="ui_send"></button>
          </form>
          <div class="hint" data-i18n="ui_free_lang"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2 data-i18n="ui_people_title"></h2>
          <div id="people"><span class="hint" data-i18n="ui_none_yet"></span></div>
        </div>
        <div class="card">
          <h2 data-i18n="ui_reminders"></h2>
          <div id="rems"><span class="hint" data-i18n="ui_rem_none"></span></div>
        </div>
        <div class="card">
          <h2 data-i18n="ui_key_title"></h2>
          <code class="key" id="keyShow"></code>
          <div class="row">
            <button class="ghost" id="copyBtn" type="button" data-i18n="ui_copy"></button>
            <button class="ghost" id="refreshBtn" type="button" data-i18n="ui_refresh"></button>
          </div>
          <div class="hint" id="queueNote"></div>
          <div class="hint" data-i18n="ui_key_note"></div>
          <div class="card" id="telegramLinkCard" style="margin-top:12px">
            <h2 data-i18n="ui_telegram_title"></h2>
            <p class="hint" data-i18n="ui_telegram_note"></p>
            <a id="telegramBotLink" class="botLink" href="https://t.me/memorandachatbot" target="_blank" rel="noopener noreferrer" data-i18n="ui_telegram_open"></a>
            <ol class="hint">
              <li data-i18n="ui_telegram_step1"></li>
              <li data-i18n="ui_telegram_step2"></li>
              <li data-i18n="ui_telegram_step3"></li>
            </ol>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="ghost" id="switchBtn" type="button"
                    data-i18n="ui_switch_book"></button>
            <button class="ghost" id="changeLangBtn" type="button"
                    data-i18n="ui_change_lang"></button>
          </div>
          <div class="row" style="margin-top:8px">
            <select id="curSet">
              <option value="IDR" data-i18n="ui_cur_idr"></option>
              <option value="USD" data-i18n="ui_cur_usd"></option>
            </select>
            <button class="ghost" id="curBtn" type="button"
                    data-i18n="ui_change_cur"></button>
          </div>
          <div class="row" style="margin-top:8px">
            <label class="hidden" for="tzSet" data-i18n="ui_timezone"></label>
            <select id="tzSet">
              <option value="Asia/Jakarta" data-i18n="ui_tz_jakarta"></option>
              <option value="Asia/Makassar" data-i18n="ui_tz_makassar"></option>
              <option value="Asia/Jayapura" data-i18n="ui_tz_jayapura"></option>
              <option value="Asia/Singapore" data-i18n="ui_tz_singapore"></option>
              <option value="Asia/Bangkok" data-i18n="ui_tz_bangkok"></option>
              <option value="UTC" data-i18n="ui_tz_utc"></option>
              <option value="Europe/London" data-i18n="ui_tz_london"></option>
              <option value="America/New_York" data-i18n="ui_tz_new_york"></option>
              <option value="America/Los_Angeles" data-i18n="ui_tz_los_angeles"></option>
            </select>
            <button class="ghost" id="tzBtn" type="button" data-i18n="ui_change_timezone"></button>
          </div>
          <div id="langErr2" class="err"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let KEY = localStorage.getItem("fieldpack_key") || "";
let LANG = localStorage.getItem("fieldpack_lang") || "";
let CUR = localStorage.getItem("fieldpack_cur") || "";
let T = null;                 // the string bundle for LANG
let PACK_ID = "";             // set only after the server validates the passkey
let HISTORY_TOKEN = 0;         // ignores state responses from a book we already left
const CHAT_HISTORY_LIMIT = 100;
const NATIVE = { id: "Bahasa Indonesia", en: "English" };

function setTheme(theme){
  const chosen = theme === "light" ? "light" : "dark";
  document.documentElement.dataset.theme = chosen;
  localStorage.setItem("memoranda_theme", chosen);
  const button = $("themeBtn");
  if(button){button.textContent = chosen === "dark" ? "Light mode" : "Dark mode";
    button.setAttribute("aria-label", chosen === "dark" ? "Switch to light theme" : "Switch to dark theme");}
}

function guessLang() {
  const nav = (navigator.language || "en").toLowerCase();
  return nav.startsWith("id") ? "id" : "en";
}

async function get(path) {
  const res = await fetch(path);
  return res.json();
}

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  return res.json();
}

/* Every visible word comes from the server bundle, so the page never becomes
   the thing that is only translated halfway. */
function paint() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (T && T[key]) el.textContent = T[key];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    const key = el.getAttribute("data-i18n-ph");
    if (T && T[key]) el.setAttribute("placeholder", T[key]);
  });
  $("langTag").textContent = NATIVE[LANG] || (T ? T.lang_name : "");
  /* The product name comes from the same server bundle as every other word on
     the page, so renaming it is one line in lang.py. */
  if (T && T.brand) {
    document.title = T.brand;
    const h1 = document.querySelector("header h1");
    if (h1) h1.textContent = T.brand;
    const mk = document.querySelector("header .mark");
    if (mk) mk.textContent = T.brand.trim().charAt(0).toUpperCase();
  }
  document.documentElement.lang = LANG || "en";
}

async function useLang(code) {
  T = await get("/api/i18n?lang=" + encodeURIComponent(code));
  T.lang_name = NATIVE[code] || T.lang_name;
  paint();
}

function fill(template, ...args) {
  let out = template || "";
  args.forEach((value) => { out = out.replace("%s", value); });
  return out;
}

/* The shape of a number follows the language, the mark in front of it follows
   the book. A rupiah figure gets no mark on purpose: nobody says "Rp 150rb" out
   loud, and a dollar figure without its mark reads as a rupiah figure to anyone
   who switched the page to English. */
function money(n) {
  n = n || 0;
  let body;
  if (LANG === "en") {
    body = (n && n % 1000000 === 0) ? (n / 1000000) + "m"
      : (n && n % 1000 === 0) ? (n / 1000) + "k"
      : n.toLocaleString("en-US");
  } else {
    body = (n && n % 1000000 === 0) ? (n / 1000000) + "jt"
      : (n && n % 1000 === 0) ? (n / 1000) + "rb"
      : n.toLocaleString("id-ID");
  }
  return CUR === "USD" ? "$" + body : body;
}

/* The money is a setting of the book, so it is kept where the language is kept
   and read back with it. */
function setCur(code) {
  CUR = code || (LANG === "en" ? "USD" : "IDR");
  localStorage.setItem("fieldpack_cur", CUR);
  const tag = $("curTag");
  if (tag) tag.textContent = CUR === "USD" ? "USD" : "Rp";
  if ($("curSet")) $("curSet").value = CUR;
}

let CHAT_HISTORY = [];

function readHistory() {
  return Array.isArray(CHAT_HISTORY) ? CHAT_HISTORY.slice(-CHAT_HISTORY_LIMIT) : [];
}

function saveHistory(rows) {
  CHAT_HISTORY = Array.isArray(rows) ? rows.slice(-CHAT_HISTORY_LIMIT) : [];
}

function renderHistory() {
  const log = $("log");
  log.innerHTML = "";
  const rows = CHAT_HISTORY.slice(-CHAT_HISTORY_LIMIT);
  if (!rows.length) {
    const welcome = document.createElement("div");
    welcome.className = "msg sys";
    welcome.textContent = T.ui_welcome;
    log.appendChild(welcome);
  }
  for (const row of rows) {
    const div = document.createElement("div");
    div.className = "msg " + (row.pending ? "bot pending" : row.role === "me" ? "me" :
      row.role === "bot" ? (row.kind === "confirm" ? "bot confirm" : "bot") : "sys");
    div.textContent = row.text;
    log.appendChild(div);
  }
  log.scrollTop = log.scrollHeight;
}

function cachePackId(id) {
  const next = id || "";
  if (PACK_ID && next && PACK_ID !== next) saveHistory([]);
  PACK_ID = next;
}

function persistMessage(role, text, kind = "") {
  if (typeof text !== "string" || !text) return;
  const rows = readHistory();
  rows.push({ role, kind, text });
  saveHistory(rows);
}

function settlePendingReply(text, kind = "") {
  const rows = readHistory();
  let index = -1;
  for (let i = rows.length - 1; i >= 0; i--) {
    if (rows[i].role === "bot" && rows[i].pending === true) { index = i; break; }
  }
  if (index >= 0) {
    rows[index] = { role: "bot", kind, text, pending: false };
  } else {
    rows.push({ role: "bot", kind, text, pending: false });
  }
  saveHistory(rows);
}

function markPendingReply(text) {
  // Temporary only; only complete turns are persisted server-side.
}

function bubble(text, cls, persist = true) {
  const role = cls === "me" ? "me" : cls === "bot" || cls === "bot confirm" ? "bot" : "sys";
  const div = document.createElement("div");
  div.className = "msg " + (cls || "sys");
  div.textContent = text;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  if (persist && PACK_ID) {
    persistMessage(role, text, cls === "bot confirm" ? "confirm" : "");
  }
  return div;
}

function finalizePendingBubble(element, text, kind = "") {
  element.textContent = text;
  element.className = "msg " + (kind === "confirm" ? "bot confirm" : "bot");
  settlePendingReply(text, kind);
}

function renderState(state) {
  const box = $("people");
  box.innerHTML = "";
  if (!state || !state.people || !state.people.length) {
    const span = document.createElement("span");
    span.className = "hint";
    span.textContent = T.ui_none_yet;
    box.appendChild(span);
    return;
  }
  state.people.forEach((p) => {
    const el = document.createElement("div");
    el.className = "person";
    const subjects = (p.subjects || [])
      .map((s) => s.label + (s.last_job ? " (" + s.last_job + ")" : ""))
      .join(", ");
    const last = (p.last_jobs && p.last_jobs[0])
      ? fill(T.ui_last, p.last_jobs[0].when + " " + p.last_jobs[0].what) : "";
    el.innerHTML =
      '<div class="top"><span class="name"></span>' +
      '<span class="owe ' + (p.owes || p.credit ? "" : "zero") + '"></span></div>' +
      '<div class="meta"></div>';
    el.querySelector(".name").textContent = p.name;
    el.querySelector(".owe").textContent = p.owes ? fill(T.ui_owed, money(p.owes))
      : (p.credit ? fill(T.ui_credit, money(p.credit)) : T.ui_settled);
    el.querySelector(".meta").textContent = [subjects, last].filter(Boolean).join(" | ");
    box.appendChild(el);
  });
}

/* Reminders, worked out by the server from the balance each time. A "collect"
   reminder for somebody who already paid does not reach this function at all,
   which is the point: a wrong line cannot be edited on Walrus, so it has to be
   decided again on every read. */
function renderReminders(rems) {
  const box = $("rems");
  box.innerHTML = "";
  if (!rems || !rems.length) {
    const span = document.createElement("span");
    span.className = "hint";
    span.textContent = T.ui_rem_none;
    box.appendChild(span);
    return;
  }
  rems.forEach((r) => {
    const el = document.createElement("div");
    el.className = "rem";
    el.innerHTML = '<div class="top"><span class="who"></span>' +
      '<span class="when"></span></div>' +
      '<div class="what"></div>';
    el.querySelector(".who").textContent = r.person || "";
    /* The distance and the job it came out of, both worked out by the server, so
       the page and the bot cannot drift apart on what a reminder means. */
    el.querySelector(".when").textContent =
      [r.date, r.time, r.when].filter(Boolean).join(" · ");
    el.querySelector(".what").textContent =
      [r.text, r.from].filter(Boolean).join(" · ");
    box.appendChild(el);
  });
}

function setShopTag(name) {
  const el = $("nameTag");
  if (!el) return;
  el.textContent = name || "";
  el.classList.toggle("hidden", !name);
}

function show(key, packId = "") {
  KEY = key;
  HISTORY_TOKEN++;
  if (packId) cachePackId(packId);
  localStorage.setItem("fieldpack_key", key);
  $("langGate").classList.add("hidden");
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("keyShow").textContent = key;
  $("log").innerHTML = "";
  bubble(T.ui_welcome, "sys", false);
  renderHistory();
  load();
}

function gate() {
  $("app").classList.add("hidden");
  $("gate").classList.remove("hidden");
  setShopTag("");
}

function langGate() {
  $("langGate").classList.remove("hidden");
  $("gate").classList.add("hidden");
  $("app").classList.add("hidden");
}

/* Opening a book reads it back from Walrus, which takes a few seconds. Without
   this the page shows the empty hints for that whole time and looks like the
   notes are gone. */
function loading() {
  ["people", "rems"].forEach((id) => {
    const box = $(id);
    if (!box) return;
    box.innerHTML = "";
    const span = document.createElement("span");
    span.className = "hint";
    span.textContent = T.ui_opening || "…";
    box.appendChild(span);
  });
}

async function load() {
  if (!KEY) return gate();
  const token = HISTORY_TOKEN;
  loading();
  const out = await post("/api/state", { passkey: KEY });
  if (token !== HISTORY_TOKEN) return;
  if (!out.ok) {
    $("gateMsg").textContent = out.error || T.unknown_key;
    localStorage.removeItem("fieldpack_key");
    localStorage.removeItem("memoranda_chat_active_pack");
    KEY = "";
    PACK_ID = "";
    return gate();
  }
  cachePackId(out.pack_id || PACK_ID);
  saveHistory(Array.isArray(out.history) ? out.history : []);
  renderHistory();
  /* The pack's language wins over the browser's. Somebody opening the same key
     on a borrowed phone should read it in the language the owner chose. */
  if (out.lang && out.lang !== LANG) {
    localStorage.setItem("fieldpack_lang", out.lang);
    LANG = out.lang;
    await useLang(out.lang);
  }
  renderState(out.state);
  renderReminders(out.reminders);
  setCur(out.currency || CUR);
  if ($("tzSet")) $("tzSet").value = out.timezone || "Asia/Jakarta";
  // The playbook id is "ac_service", not a word. It gets the same treatment as
  // every other word on the page: looked up in the bundle for the language in
  // use, so an English page does not show the Indonesian name of the trade.
  const pb = (out.state.pack && out.state.pack.playbook) || "";
  $("bizTag").textContent = (T && T["ui_biz_" + pb]) || pb.replace(/_/g, " ") || "pack";
  setShopTag((out.state.pack && out.state.pack.name) || "");
  const note = $("queueNote");
  if (note) note.textContent = "";
  return out;
}

document.querySelectorAll("[data-pick]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const pick = btn.getAttribute("data-pick");
    // With a pack open this is a change, not a first choice, so it has to be
    // written to Walrus: the pack carries its own language, and the next device
    // that opens this key has to read the same one.
    if (KEY) return pickPackLang(pick);
    LANG = pick;
    localStorage.setItem("fieldpack_lang", LANG);
    await useLang(LANG);
    // The money follows the language as a default, and only as a default: it is
    // the one guess on this page that costs money when it is wrong, so the create
    // form puts it in front of the person instead of deciding for them.
    setCur(pick === "en" ? "USD" : "IDR");
    if ($("curIn")) $("curIn").value = CUR;
    $("tzFirst").classList.remove("hidden");
    $("langGate").classList.add("hidden");
    gate();
    if (KEY) show(KEY);
  });
});

$("enterForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const value = $("passkeyIn").value.trim();
  // $ is getElementById here, not a CSS selector. $("enterForm button") is null,
  // and touching it killed the handler before the request ever went out.
  const btn = document.querySelector("#enterForm button");
  btn.disabled = true;
  btn.textContent = T.ui_opening;
  try {
    const out = await post("/api/pack", { action: "enter", passkey: value, lang: LANG });
    if (!out.ok) { $("gateMsg").textContent = out.error; return; }
    // A failed try leaves a message behind, and it stayed there across a later
    // successful open, so the next failure looked like the previous one.
    $("gateMsg").textContent = "";
    show(value, out.pack_id || "");
  } finally {
    btn.disabled = false;
    btn.textContent = T.ui_open;
  }
});

$("createForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.querySelector("#createForm button");
  btn.disabled = true;
  btn.textContent = T.ui_creating;
  // A new book is one write to Walrus, and a write is thirty to forty seconds.
  // A button that only goes grey for that long is indistinguishable from a hang,
  // which is exactly how it was read the first time.
  $("gateMsg").textContent = T.ui_creating_note;
  try {
    const out = await post("/api/pack", {
      action: "create", biz: $("bizIn").value, name: $("nameIn").value,
      lang: LANG, cur: $("curIn") ? $("curIn").value : "",
      tz: $("tzFirstSet") ? $("tzFirstSet").value : "Asia/Jakarta"
    });
    if (!out.ok) { $("gateMsg").textContent = out.error || T.ui_failed; return; }
    $("gateMsg").textContent = "";
    setCur(out.currency);
    show(out.passkey, out.pack_id || "");
    bubble(fill(T.ui_newkey, "") + " " + out.passkey, "sys", false);
    const card = $("telegramLinkCard");
    if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
  } finally {
    btn.disabled = false;
    btn.textContent = T.ui_create;
  }
});

$("sayForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("sayIn").value.trim();
  if (!text) return;
  bubble(text, "me", false);
  markPendingReply(T.ui_thinking);
  $("sayIn").value = "";
  $("sayBtn").disabled = true;
  // Writing to Walrus takes twenty to forty seconds, and a button that just goes
  // grey reads as a hang. The placeholder says what is happening and turns into
  // the answer when it arrives.
  const slot = bubble(T.ui_thinking, "bot", false);
  try {
    const out = await post("/api/web/turn", { passkey: KEY, text });
    if (!out.ok) {
      finalizePendingBubble(slot, out.error || T.ui_failed);
      return;
    }
    finalizePendingBubble(slot, out.say, out.kind === "confirm" ? "confirm" : "");
    await load();
  } catch (err) {
    finalizePendingBubble(slot, String(err));
  } finally {
    $("sayBtn").disabled = false;
    $("sayIn").focus();
  }
});

// Without this there is no way out of a book at all: the key is kept in the
// browser, so every reload walks back into the same pack, and "start over" turns
// into staring at the same customer again.
$("switchBtn").addEventListener("click", () => {
  HISTORY_TOKEN++;
  localStorage.removeItem("fieldpack_key");
  KEY = "";
  PACK_ID = "";
  localStorage.removeItem("memoranda_chat_active_pack");
  $("keyShow").textContent = "";
  $("log").innerHTML = "";
  $("passkeyIn").value = "";
  $("queueNote").textContent = "";
  gate();
  $("passkeyIn").focus();
});

$("copyBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(KEY);
  bubble(T.ui_copied);
});
$("refreshBtn").addEventListener("click", load);

$("changeLangBtn").addEventListener("click", () => {
  $("langErr2").textContent = "";
  langGate();
});

$("telegramBotLink").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(KEY);
    bubble(T.ui_copied);
  } catch (_err) {
    // The visible book key remains available to select and copy manually.
  }
});

async function pickPackLang(value) {
  const out = await post("/api/pack", { action: "lang", passkey: KEY, lang: value });
  if (!out.ok) { $("langErr2").textContent = out.error || "error"; return; }
  localStorage.setItem("fieldpack_lang", out.lang);
  LANG = out.lang;
  await useLang(out.lang, out.lang_name);
  // The money is carried across untouched. Changing the labels on a book does not
  // change the currency it is written in.
  setCur(out.currency);
  $("langGate").classList.add("hidden");
  show(KEY);
}

$("curBtn").addEventListener("click", async () => {
  $("langErr2").textContent = "";
  const out = await post("/api/pack",
                         { action: "lang", passkey: KEY, cur: $("curSet").value });
  if (!out.ok) { $("langErr2").textContent = out.error || "error"; return; }
  setCur(out.currency);
  await load();
  bubble(fill(T.ui_cur_now, CUR === "USD" ? T.ui_cur_usd : T.ui_cur_idr));
});

$("tzBtn").addEventListener("click", async () => {
  $("langErr2").textContent = "";
  const out = await post("/api/pack", {
    action: "lang", passkey: KEY, tz: $("tzSet").value
  });
  if (!out.ok) { $("langErr2").textContent = out.error || "error"; return; }
  await load();
  bubble(fill(T.ui_tz_saved, out.timezone_label || out.timezone));
});

(async function boot() {
  setTheme(localStorage.getItem("memoranda_theme") || "dark");
  $("themeBtn").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  if (!LANG) {
    LANG = guessLang();
    localStorage.setItem("fieldpack_lang", LANG);
  }
  await useLang(LANG);
  if (!KEY) return langGate();
  const out = await post("/api/pack", { action: "enter", passkey: KEY, lang: LANG });
  if (out.ok) show(KEY, out.pack_id || ""); else {
    localStorage.removeItem("fieldpack_key");
    KEY = "";
    PACK_ID = "";
    localStorage.removeItem("memoranda_chat_active_pack");
    langGate();
  }
})();
</script>
</body>
</html>
